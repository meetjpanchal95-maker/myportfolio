<text fill="#EEEEEE" style="white-space: pre" xml:space="preserve" font-family="Satoshi" font-size="25" font-weight="bold" letter-spacing="0em"><tspan x="661" y="150.625">Transform Historical Project Data into Predictive </tspan><tspan x="661" y="184.625">Insights</tspan></text>
<text fill="#777B84" style="white-space: pre" xml:space="preserve" font-family="Satoshi" font-size="13" letter-spacing="0em"><tspan x="661" y="206.005">Past project data can be converted into business intelligence that highlights patterns and risks. </tspan><tspan x="661" y="224.005">Dashboards help managers anticipate delays, budget issues, or resource constraints in future and </tspan><tspan x="661" y="242.005">ongoing projects.</tspan></text>
</g>
</g>
