<g clip-path="url(#clip3_7486_22061)">
<text fill="#EEEEEE" style="white-space: pre" xml:space="preserve" font-family="Satoshi" font-size="25" font-weight="bold" letter-spacing="0em"><tspan x="60" y="167.625">Understand Manager Decision Making Journey</tspan></text>
<text fill="#777B84" style="white-space: pre" xml:space="preserve" font-family="Satoshi" font-size="13" letter-spacing="0em"><tspan x="60" y="189.005">UX research identifies when and how managers make decisions during a project. Existing data can </tspan><tspan x="60" y="207.005">be reorganized into dashboards that surface only the most relevant insights at each project stage, </tspan><tspan x="60" y="225.005">enabling faster and clearer decision-making.</tspan></text>
</g>
