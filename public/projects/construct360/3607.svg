<g clip-path="url(#clip8_7486_22061)">
<text fill="#EEEEEE" style="white-space: pre" xml:space="preserve" font-family="Satoshi" font-size="25" font-weight="bold" letter-spacing="0em"><tspan x="60" y="356.625">Design Role-Based Dashboards for Clarity and </tspan><tspan x="60" y="390.625">Focus</tspan></text>
<text fill="#777B84" style="white-space: pre" xml:space="preserve" font-family="Satoshi" font-size="13" letter-spacing="0em"><tspan x="60" y="412.005">UX research shows that different management roles need different data views. Tailored dashboards </tspan><tspan x="60" y="430.005">improve clarity, reduce information overload, and increase adoption by presenting only role-specific </tspan><tspan x="60" y="448.005">metrics.</tspan></text>
</g>
